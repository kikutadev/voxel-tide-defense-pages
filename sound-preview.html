<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102d38"><title>潮界防衛 | 効果音レビュー</title>  <script type="module" crossorigin src="./assets/sound-BVSAiZbr.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/sound-Br3Ck6RR.js">
  <link rel="stylesheet" crossorigin href="./assets/sound-COfMno9C.css">
</head>
<body><main>
<header class="intro"><a href="./">‹ ゲームへ</a><h1>効果音レビュー</h1><p>潮界防衛 · 現行音と新しい候補を聴き比べて、採用する音を選んでください。</p></header>
<section class="controls" aria-label="試聴設定">
  <div class="volume"><label for="volume">音量 <output id="volume-value">100%</output></label><input id="volume" type="range" min="0" max="100" value="100"><button id="stop" type="button">停止</button></div>
  <div class="comparison"><strong>まとめて試聴</strong><small>開拓 → 建設 → 襲撃 → 戦闘 → 防衛成功</small><div><button id="mix-a" type="button">▶ 現行</button><button id="mix-b" type="button">▶ B</button><button id="mix-c" type="button">▶ C</button><button id="mix-selected" type="button">▶ 選択した音</button></div><small>未選択・要調整は現行音で再生します。</small></div>
  <p id="play-status" role="status" aria-live="polite">試聴ボタンで音が鳴ります。</p>
</section>
<div class="legend"><strong>A 現行</strong><span>B 質感・重量感</span><span>C 短く明快</span></div>
<nav class="jump" aria-label="カテゴリ"><a href="#group-0">操作</a><a href="#group-1">島・進行</a><a href="#group-2">戦闘</a><a href="#review">レビュー結果</a></nav>
<div id="cues"></div>
<section class="review" id="review"><h2>採用結果</h2><label for="memo">修正してほしい点（任意）</label><textarea id="memo" rows="3" placeholder="例：榴弾砲はもっと重く、技術解放はBで"></textarea><label for="result">この内容をコピーしてチャットに貼り付けてください。</label><textarea id="result" readonly rows="8" spellcheck="false"></textarea><button id="copy-result" class="primary" type="button">採用結果をコピー</button><p id="copy-status" role="status"></p></section>
</main><footer><span id="progress">0 / 23 判断済み</span><button id="clear" type="button">選択をリセット</button><button id="copy" class="primary" type="button">結果をコピー</button></footer></body></html>
