<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102d38"><title>潮界防衛 | 効果音レビュー</title>  <script type="module" crossorigin src="./assets/sound-0v1NtbcZ.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/sound-Dl8aYW9R.js">
  <link rel="stylesheet" crossorigin href="./assets/sound-BLLJLA0r.css">
</head>
<body><main>
<header class="intro"><a href="./">‹ ゲームへ</a><h1>効果音レビュー</h1><p>採用済み21音は固定しました。残りは襲撃開始と技術解放です。</p></header>
<section class="controls" aria-label="試聴設定">
  <div class="volume"><label for="volume">音量 <output id="volume-value">100%</output></label><input id="volume" type="range" min="0" max="100" value="100"><button id="stop" type="button">停止</button></div>
  <div class="comparison"><strong>まとめて試聴</strong><small>開拓 → 建設・強化 → 戦闘 → 防衛成功 → 技術解放</small><div><button id="mix-a" type="button">▶ A セット</button><button id="mix-b" type="button">▶ B セット</button><button id="mix-selected" type="button">▶ 選択した音</button></div><small>全セットに採用済み21音を使用。選択した音の試聴では、保留・要調整・音なしは鳴らしません。</small></div>
  <p id="play-status" role="status" aria-live="polite">試聴ボタンで音が鳴ります。</p>
</section>

<nav class="jump" aria-label="カテゴリ"><a href="#group-1">島・進行</a><a href="#review">レビュー結果</a></nav>
<div id="cues"></div>
<section class="review" id="review"><h2>採用結果</h2><label for="memo">修正してほしい点（任意）</label><textarea id="memo" rows="3" placeholder="例：襲撃開始はもっと緊張感が欲しい"></textarea><label for="result">この内容をコピーしてチャットに貼り付けてください。</label><textarea id="result" readonly rows="8" spellcheck="false"></textarea><button id="copy-result" class="primary" type="button">採用結果をコピー</button><p id="copy-status" role="status"></p></section>
</main><footer><span id="progress">0 / 2 再判断済み</span><button id="clear" type="button">選択をリセット</button><button id="copy" class="primary" type="button">結果をコピー</button></footer></body></html>
