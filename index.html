<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#091e2b" /><title>潮界防衛 — 島を拡張するタワーディフェンス</title>  <script type="module" crossorigin src="./assets/game-8LQAoKrF.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/sound-Dl8aYW9R.js">
  <link rel="stylesheet" crossorigin href="./assets/game-7YI0NTdA.css">
</head>
<body><main id="app">
<section class="field home-active" id="field" aria-label="ボクセルの島">
  <div id="scene"></div>
  <section id="home-screen" class="home-screen" aria-label="ホーム"></section>
  <div class="topbar">
    <div class="stats" id="hud-stats" aria-live="polite"></div>
    <button id="pause-btn" class="pause icon-btn" title="一時停止" aria-label="一時停止">Ⅱ</button>
    <div class="scene-label" id="hud-labels"></div>
    <div class="hud-secondary"><div id="react-forecast-host"></div><div id="wave-meter" hidden><i></i></div><button id="wave-report" hidden>前回の戦果</button></div><div id="online-nav" class="online-nav"><button id="online-toggle">オンライン</button><button id="history-btn">戦闘履歴</button><button id="ranking-btn" hidden>順位</button><button id="code-btn" hidden>復帰コード</button><button id="sync-btn" hidden>再同期</button></div>
  </div>
  <div id="wave-banner" class="wave-banner" aria-live="polite"></div>
  <div id="review-bar" hidden><span id="review-summary"></span><button id="review-return">結果に戻る</button></div><div id="tooltip" class="tooltip" role="status"></div>
  <div class="view-controls"><button type="button" id="zoom-in" aria-label="拡大">＋</button><button type="button" id="zoom-out" aria-label="縮小">−</button><button id="sound-btn" type="button" aria-label="効果音" title="効果音の切替">音 ON</button><button type="button" id="reset-view" aria-label="視点を戻す">⌖</button></div>
  <div class="bottom-area">
    <div id="facility-panel" class="facility-panel" hidden></div><div id="build-plan" class="build-plan" hidden></div><div id="build-status" class="build-status"></div><div class="build-bar" id="build-bar"></div>
        <div id="scout-panel" class="scout-panel" hidden></div>
    <div id="replay-panel" class="raid-panel" hidden></div>
    <div id="raid-panel" class="raid-panel" hidden></div>
    <div class="battle-controls" id="battle-controls"></div>

  </div>
  <div id="expand-panel" class="expand-panel" hidden><h2>どの島をつなぐ？</h2><p id="expand-detail">海域から無人島を選択</p><div id="expand-choices" class="expand-choices"></div><button id="confirm-expand" class="confirm-expand">この島をつなぐ</button><button id="close-expand" class="close-expand">準備に戻る</button></div>
  <div id="overlay" class="overlay" hidden></div>
  <dialog id="tech-dialog" class="game-dialog tech-dialog"><div class="dialog-heading"><h2>技術開発</h2><button data-close="tech-dialog" aria-label="閉じる">×</button></div><div class="tech-balance"><strong id="tech-balance"></strong><span id="tech-count"></span></div><p>解放した技術は次の防衛から使用できます。</p><div id="tech-list"></div><div id="tech-error" role="status"></div><button id="tech-close" class="primary">ホームに戻る</button></dialog>  <dialog id="online-dialog" class="game-dialog"></dialog>
  <dialog id="code-dialog" class="game-dialog"></dialog>
  <dialog id="history-dialog" class="game-dialog"></dialog>
  <div class="intro-tip" id="intro-tip" hidden></div>
</section>
<div id="react-ui-root"></div>
</main></body></html>
